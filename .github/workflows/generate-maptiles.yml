name: generate maptiles
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 */4 * *'

permissions:
  pages: write
  id-token: write

jobs:
  build-vector:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Cache vector tiles
        id: cache-vector
        uses: actions/cache@v4
        with:
          path: hong-kong.pmtiles
          key: hong-kong-vector-debug

      - name: Skip generation if cache hit
        if: steps.cache-vector.outputs.cache-hit == 'true'
        run: echo "✅ Vector tiles restored from cache – skipping generation"

      - name: protomaps basemaps repo
        if: steps.cache-vector.outputs.cache-hit != 'true'
        run: git clone --depth 1 https://github.com/protomaps/basemaps.git

      - name: download osm
        if: steps.cache-vector.outputs.cache-hit != 'true'
        run: |
          wget -q https://download.geofabrik.de/asia/china/hong-kong-latest.osm.pbf -O hong-kong.osm.pbf

      - name: download data sources
        if: steps.cache-vector.outputs.cache-hit != 'true'
        working-directory: basemaps/tiles
        run: |
          mkdir -p data/sources
          wget -q -c https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip -O data/sources/natural_earth_vector.sqlite.zip
          wget -q -c --tries=5 https://qrank.toolforge.org/download/qrank.csv.gz -O data/sources/qrank.csv.gz

      - name: setup java
        if: steps.cache-vector.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: generate vector tiles
        if: steps.cache-vector.outputs.cache-hit != 'true'
        working-directory: basemaps/tiles
        run: |
          mvn -B -q clean package
          mv ../../hong-kong.osm.pbf data/sources/
          java -Xmx10g -jar target/protomaps-basemap-HEAD-with-deps.jar \
            --area=hong-kong \
            --download \
            --force
          mv hong-kong.pmtiles ../../hong-kong.pmtiles

      - name: upload vector artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-tiles
          path: hong-kong.pmtiles
          retention-days: 5

  build-raster:
    needs: build-vector
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: download vector artifact
        uses: actions/download-artifact@v4
        with:
          name: vector-tiles

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libgbm-dev libosmesa6-dev xvfb

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install tileserver-gl
        run: npm install -g tileserver-gl

      - name: prepare data + config + style
        run: |
          mkdir -p data styles fonts sprites

          # Move vector tiles
          if [ -f "hong-kong.pmtiles" ]; then
            mv hong-kong.pmtiles data/hong-kong-vector.pmtiles
          elif [ -f "vector-tiles/hong-kong.pmtiles" ]; then
            mv vector-tiles/hong-kong.pmtiles data/hong-kong-vector.pmtiles
          else
            echo "hong-kong.pmtiles not found"
            ls -la
            exit 1
          fi

          # Copy style from repo
          cp style.json styles/style.json

          # Write config
          cat > config.json << 'EOF'
          {
            "options": {
              "paths": {
                "root": ".",
                "styles": "styles",
                "pmtiles": "data",
                "fonts": "fonts",
                "sprites": "sprites"
              },
              "serveStaticMaps": true
            },
            "styles": {
              "basic": {
                "style": "style.json"
              }
            },
            "data": {
              "hong-kong-vector": {
                "pmtiles": "hong-kong-vector.pmtiles"
              }
            }
          }
          EOF

      - name: start tileserver and scrape tiles
        run: |
          # Start tileserver and capture logs
          xvfb-run -a tileserver-gl config.json --port 8080 > tileserver.log 2>&1 &
          TILESERVER_PID=$!
          echo "Tileserver PID: $TILESERVER_PID"

          echo "Waiting for tileserver..."
          for i in {1..40}; do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "Health check passed"
              break
            fi
            # Show logs if it's taking long
            if [ $i -eq 10 ] || [ $i -eq 20 ]; then
              echo "===== tileserver.log so far ====="
              cat tileserver.log || true
            fi
            sleep 3
          done

          echo "===== Full tileserver.log ====="
          cat tileserver.log || true

          echo "===== /styles.json ====="
          curl -s http://127.0.0.1:8080/styles.json || echo "styles.json failed"

          # Check if process is still running
          if ! kill -0 $TILESERVER_PID 2>/dev/null; then
            echo "ERROR: tileserver process has already died"
            exit 1
          fi

          # ----- scraper (same as before) -----
          cat > scrape_raster.py << 'EOF'
          import urllib.request
          import sqlite3
          import math
          import sys

          min_lng, min_lat, max_lng, max_lat = 113.8, 22.1, 114.5, 22.6
          min_zoom, max_zoom = 0, 12   # temporarily lower maxzoom for testing

          def deg2num(lat_deg, lon_deg, zoom):
              lat_rad = math.radians(lat_deg)
              n = 2.0 ** zoom
              x = int((lon_deg + 180.0) / 360.0 * n)
              y = int((1.0 - math.asinh(math.tan(lat_rad)) / math.pi) / 2.0 * n)
              return (x, y)

          conn = sqlite3.connect('hong-kong-raster.mbtiles')
          c = conn.cursor()
          c.execute('CREATE TABLE metadata (name text, value text);')
          c.execute("INSERT INTO metadata VALUES ('name', 'hong-kong-raster');")
          c.execute("INSERT INTO metadata VALUES ('format', 'png');")
          c.execute(f"INSERT INTO metadata VALUES ('bounds', '{min_lng},{min_lat},{max_lng},{max_lat}');")
          c.execute("INSERT INTO metadata VALUES ('minzoom', '0');")
          c.execute("INSERT INTO metadata VALUES ('maxzoom', '12');")
          c.execute('CREATE TABLE tiles (zoom_level integer, tile_column integer, tile_row integer, tile_data blob);')
          c.execute('CREATE UNIQUE INDEX tile_index on tiles (zoom_level, tile_column, tile_row);')

          total_tiles = 0
          errors = 0

          for z in range(min_zoom, max_zoom + 1):
              x_min, y_max = deg2num(min_lat, min_lng, z)
              x_max, y_min = deg2num(max_lat, max_lng, z)
              print(f"Zoom {z}: x={x_min}..{x_max}, y={y_min}..{y_max}")

              for x in range(x_min, x_max + 1):
                  for y in range(y_min, y_max + 1):
                      url = f"http://127.0.0.1:8080/styles/basic/{z}/{x}/{y}.png"
                      try:
                          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                          with urllib.request.urlopen(req, timeout=20) as response:
                              tile_data = response.read()
                          tms_y = (2 ** z) - 1 - y
                          c.execute(
                              'INSERT INTO tiles (zoom_level, tile_column, tile_row, tile_data) VALUES (?, ?, ?, ?)',
                              (z, x, tms_y, tile_data)
                          )
                          total_tiles += 1
                      except Exception as e:
                          if errors < 10:
                              print(f"Failed {url}: {e}")
                          errors += 1

          conn.commit()
          conn.close()
          print(f"\nSuccessfully baked {total_tiles} raster tiles. Errors: {errors}")
          if total_tiles == 0:
              sys.exit("Error: 0 tiles downloaded")
          EOF

          python3 scrape_raster.py

          kill $TILESERVER_PID || true

      - name: download pmtiles cli
        run: |
          wget -q https://github.com/protomaps/go-pmtiles/releases/download/v1.31.1/go-pmtiles_1.31.1_Linux_x86_64.tar.gz
          tar -xzf go-pmtiles_1.31.1_Linux_x86_64.tar.gz
          chmod +x pmtiles

      - name: convert mbtiles to pmtiles
        run: |
          ls -lh hong-kong-raster.mbtiles
          ./pmtiles convert hong-kong-raster.mbtiles hong-kong-raster.pmtiles

      - name: upload raster artifact
        uses: actions/upload-artifact@v4
        with:
          name: raster-tiles
          path: hong-kong-raster.pmtiles
          retention-days: 5

  deploy:
    needs: [build-vector, build-raster]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4

      - name: prepare site
        run: |
          mkdir -p _site
          # Keep the real extension. Clients (and browsers) care about the correct extension / Content-Type.
          mv vector-tiles/hong-kong.pmtiles _site/hong-kong.pmtiles
          mv raster-tiles/hong-kong-raster.pmtiles _site/hong-kong-raster.pmtiles
          # Optional: add a simple index.html that demos the tiles with MapLibre

      - name: setup pages
        uses: actions/configure-pages@v5

      - name: upload artifact for pages deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
