name: generate maptiles
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 */4 * *'

permissions:
  pages: write
  id-token: write

jobs:
  build-vector:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Cache vector tiles
        id: cache-vector
        uses: actions/cache@v4
        with:
          path: hong-kong.pmtiles
          key: hong-kong-vector-debug

      - name: Skip generation if cache hit
        if: steps.cache-vector.outputs.cache-hit == 'true'
        run: echo "✅ Vector tiles restored from cache – skipping generation"

      - name: protomaps basemaps repo
        if: steps.cache-vector.outputs.cache-hit != 'true'
        run: git clone --depth 1 https://github.com/protomaps/basemaps.git

      - name: download osm
        if: steps.cache-vector.outputs.cache-hit != 'true'
        run: |
          wget -q https://download.geofabrik.de/asia/china/hong-kong-latest.osm.pbf -O hong-kong.osm.pbf

      - name: download data sources
        if: steps.cache-vector.outputs.cache-hit != 'true'
        working-directory: basemaps/tiles
        run: |
          mkdir -p data/sources
          wget -q -c https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip -O data/sources/natural_earth_vector.sqlite.zip
          wget -q -c --tries=5 https://qrank.toolforge.org/download/qrank.csv.gz -O data/sources/qrank.csv.gz

      - name: setup java
        if: steps.cache-vector.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: generate vector tiles
        if: steps.cache-vector.outputs.cache-hit != 'true'
        working-directory: basemaps/tiles
        run: |
          mvn -B -q clean package
          mv ../../hong-kong.osm.pbf data/sources/
          java -Xmx10g -jar target/protomaps-basemap-HEAD-with-deps.jar \
            --area=hong-kong \
            --download \
            --force
          mv hong-kong.pmtiles ../../hong-kong.pmtiles

      - name: upload vector artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-tiles
          path: hong-kong.pmtiles
          retention-days: 5

  build-raster:
    needs: build-vector
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: download vector artifact
        uses: actions/download-artifact@v4
        with:
          name: vector-tiles

      - name: prepare data + style + config
        run: |
          mkdir -p styles fonts sprites

          # Move the vector tiles artifact
          if [ -f "hong-kong.pmtiles" ]; then
            mv hong-kong.pmtiles hong-kong-vector.pmtiles
          elif [ -f "vector-tiles/hong-kong.pmtiles" ]; then
            mv vector-tiles/hong-kong.pmtiles hong-kong-vector.pmtiles
          else
            echo "Error: hong-kong.pmtiles not found"
            ls -la
            exit 1
          fi

          # Use the style.json that is already in the repository
          cp style.json styles/style.json

          # Write config.json
          cat > config.json << 'EOF'
          {
            "options": {
              "paths": {
                "root": ".",
                "styles": "styles",
                "pmtiles": ".",
                "fonts": "fonts",
                "sprites": "sprites"
              },
              "serveStaticMaps": true
            },
            "styles": {
              "basic": {
                "style": "style.json",
                "tilejson": {
                  "bounds": [113.8, 22.1, 114.5, 22.6]
                }
              }
            },
            "data": {
              "hong-kong-vector": {
                "pmtiles": "hong-kong-vector.pmtiles"
              }
            }
          }
          EOF
    
      - name: generate raster mbtiles from vector pmtiles
        run: |
          docker run -d --name tileserver -p 8080:80 \
            -v $(pwd):/data \
            maptiler/tileserver-gl -c /data/config.json

          echo "Waiting for tileserver..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080/styles.json > /dev/null; then
              echo "Tileserver is up"
              break
            fi
            sleep 2
          done

          # Debug
          docker logs tileserver || true
          curl -s http://localhost:8080/styles.json || true

          # Write the scraper
          cat > scrape_raster.py << 'EOF'
          import urllib.request
          import sqlite3
          import math
          import sys

          min_lng, min_lat, max_lng, max_lat = 113.8, 22.1, 114.5, 22.6
          min_zoom, max_zoom = 0, 14

          def deg2num(lat_deg, lon_deg, zoom):
              lat_rad = math.radians(lat_deg)
              n = 2.0 ** zoom
              x = int((lon_deg + 180.0) / 360.0 * n)
              y = int((1.0 - math.asinh(math.tan(lat_rad)) / math.pi) / 2.0 * n)
              return (x, y)

          conn = sqlite3.connect('hong-kong-raster.mbtiles')
          c = conn.cursor()
          c.execute('CREATE TABLE metadata (name text, value text);')
          c.execute("INSERT INTO metadata VALUES ('name', 'hong-kong-raster');")
          c.execute("INSERT INTO metadata VALUES ('format', 'png');")
          c.execute(f"INSERT INTO metadata VALUES ('bounds', '{min_lng},{min_lat},{max_lng},{max_lat}');")
          c.execute("INSERT INTO metadata VALUES ('minzoom', '0');")
          c.execute("INSERT INTO metadata VALUES ('maxzoom', '14');")
          c.execute('CREATE TABLE tiles (zoom_level integer, tile_column integer, tile_row integer, tile_data blob);')
          c.execute('CREATE UNIQUE INDEX tile_index on tiles (zoom_level, tile_column, tile_row);')

          total_tiles = 0
          errors = 0

          for z in range(min_zoom, max_zoom + 1):
              x_min, y_max = deg2num(min_lat, min_lng, z)
              x_max, y_min = deg2num(max_lat, max_lng, z)

              for x in range(x_min, x_max + 1):
                  for y in range(y_min, y_max + 1):
                      url = f"http://localhost:8080/styles/basic/{z}/{x}/{y}.png"
                      try:
                          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                          with urllib.request.urlopen(req, timeout=30) as response:
                              tile_data = response.read()
                          tms_y = (2 ** z) - 1 - y
                          c.execute(
                              'INSERT INTO tiles (zoom_level, tile_column, tile_row, tile_data) VALUES (?, ?, ?, ?)',
                              (z, x, tms_y, tile_data)
                          )
                          total_tiles += 1
                      except Exception as e:
                          if errors < 10:
                              print(f"Failed to fetch {url}: {e}")
                          errors += 1

          conn.commit()
          conn.close()

          print(f"\nSuccessfully baked {total_tiles} raster tiles. Encountered {errors} errors.")
          if total_tiles == 0:
              sys.exit("Error: 0 tiles were successfully downloaded.")
          EOF

          # Run the scraper
          python3 scrape_raster.py

          docker stop tileserver

      - name: convert mbtiles to pmtiles
        run: ./pmtiles convert hong-kong-raster.mbtiles hong-kong-raster.pmtiles

      - name: upload raster artifact
        uses: actions/upload-artifact@v4
        with:
          name: raster-tiles
          path: hong-kong-raster.pmtiles
          retention-days: 5

  deploy:
    needs: [build-vector, build-raster]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4

      - name: prepare site
        run: |
          mkdir -p _site
          # Keep the real extension. Clients (and browsers) care about the correct extension / Content-Type.
          mv vector-tiles/hong-kong.pmtiles _site/hong-kong.pmtiles
          mv raster-tiles/hong-kong-raster.pmtiles _site/hong-kong-raster.pmtiles
          # Optional: add a simple index.html that demos the tiles with MapLibre

      - name: setup pages
        uses: actions/configure-pages@v5

      - name: upload artifact for pages deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
