name: generate maptiles
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 */4 * *'

permissions:
  pages: write
  id-token: write

jobs:
  build-vector:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: protomaps basemaps repo
        run: git clone --depth 1 https://github.com/protomaps/basemaps.git

      - name: download osm
        run: |
          wget -q https://download.geofabrik.de/asia/china/hong-kong-latest.osm.pbf -O hong-kong.osm.pbf

      - name: download data sources
        working-directory: basemaps/tiles
        run: |
          mkdir -p data/sources
          wget -q -c https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip -O data/sources/natural_earth_vector.sqlite.zip
          wget -q -c --tries=5 https://qrank.toolforge.org/download/qrank.csv.gz -O data/sources/qrank.csv.gz

      - name: setup java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: generate vector tiles
        working-directory: basemaps/tiles
        run: |
          mvn -B -q clean package
          mv ../../hong-kong.osm.pbf data/sources/
          java -Xmx10g -jar target/protomaps-basemap-HEAD-with-deps.jar \
            --area=hong-kong \
            --download \
            --force
          mv hong-kong.pmtiles ../../hong-kong.pmtiles

      - name: upload vector artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-tiles
          path: hong-kong.pmtiles
          retention-days: 5

  build-raster:
    needs: build-vector
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: download vector artifact
        uses: actions/download-artifact@v4
        with:
          name: vector-tiles

      - name: prepare data + style + config
        run: |
          mkdir -p data styles

          # Move the vector tiles
          if [ -f "hong-kong.pmtiles" ]; then
            mv hong-kong.pmtiles data/hong-kong-vector.pmtiles
          elif [ -f "vector-tiles/hong-kong.pmtiles" ]; then
            mv vector-tiles/hong-kong.pmtiles data/hong-kong-vector.pmtiles
          else
            echo "Error: hong-kong.pmtiles not found"
            ls -la
            exit 1
          fi

          # Write config.json
          cat > config.json << 'EOF'
          {
            "options": {
              "paths": {
                "root": "",
                "styles": "styles",
                "fonts": "fonts",
                "sprites": "sprites",
                "pmtiles": "data"
              },
              "serveStaticMaps": true
            },
            "styles": {
              "basic": {
                "style": "basic.json",
                "tilejson": {
                  "bounds": [113.8, 22.1, 114.5, 22.6]
                }
              }
            },
            "data": {
              "hongkong": {
                "pmtiles": "hong-kong-vector.pmtiles"
              }
            }
          }
          EOF

          # Write the style (paste the full JSON you provided, with the fixed source)
          cat > styles/basic.json << 'EOF'
          {
            "version": 8,
            "name": "basic",
            "glyphs": "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
            "sprite": "https://protomaps.github.io/basemaps-assets/sprites/v4/light",
            "sources": {
              "protomaps": {
                "type": "vector",
                "url": "pmtiles://hong-kong-vector.pmtiles"
              }
            },
            "layers": [ ... ]   ← paste the entire layers array from your file
          }
          EOF
    
      - name: generate raster mbtiles from vector pmtiles
        run: |
          docker run -d --name tileserver -p 8080:80 \
            -v $(pwd):/data \
            maptiler/tileserver-gl -c /data/config.json

          echo "Waiting for tileserver..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080/styles.json > /dev/null; then
              echo "Tileserver is up"
              break
            fi
            sleep 2
          done

          docker logs tileserver || true
          if [ "$(docker inspect -f '{{.State.Running}}' tileserver)" != "true" ]; then
            echo "Tileserver failed to start"
            docker logs tileserver
            exit 1
          fi

          # (keep your scrape_raster.py mostly as-is, just make sure the style name matches)
          url = f"http://localhost:8080/styles/basic/{z}/{x}/{y}.png"

          python3 scrape_raster.py
          docker stop tileserver

      - name: download pmtiles cli
        run: |
          wget -q https://github.com/protomaps/go-pmtiles/releases/download/v1.31.1/go-pmtiles_1.31.1_Linux_x86_64.tar.gz
          tar -xzf go-pmtiles_1.31.1_Linux_x86_64.tar.gz
          chmod +x pmtiles

      - name: convert mbtiles to pmtiles
        run: ./pmtiles convert hong-kong-raster.mbtiles hong-kong-raster.pmtiles

      - name: upload raster artifact
        uses: actions/upload-artifact@v4
        with:
          name: raster-tiles
          path: hong-kong-raster.pmtiles
          retention-days: 5

  deploy:
    needs: [build-vector, build-raster]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4

      - name: prepare site
        run: |
          mkdir -p _site
          # Keep the real extension. Clients (and browsers) care about the correct extension / Content-Type.
          mv vector-tiles/hong-kong.pmtiles _site/hong-kong.pmtiles
          mv raster-tiles/hong-kong-raster.pmtiles _site/hong-kong-raster.pmtiles
          # Optional: add a simple index.html that demos the tiles with MapLibre

      - name: setup pages
        uses: actions/configure-pages@v5

      - name: upload artifact for pages deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
